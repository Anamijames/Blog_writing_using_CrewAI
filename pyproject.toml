[project]
name = "blog_writing_crew"
version = "0.1.0"
description = "blog-writing-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.16,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["blog_writing_crew", "knowledge", "output", "tools"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "1e58d19d-15b3-4df3-bf70-3fdae6889117"
